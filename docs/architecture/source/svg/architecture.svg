<svg viewBox="0 0 1200 892" role="img" aria-label="The claimant signs in and asks a question in the web chat page. The ASP.NET Core app runs the Foundry agent on a conversation thread. The agent searches the knowledge index in Azure AI Search, asks the app to run the get_claim_status function, and the app reads the claim from the mock Claims API with the claim id from the session. The model writes the answer, guardrails screen it, and the app returns it with citations. Uploaded claim forms are analyzed by Content Understanding. The data comes from a public claims CSV, public car damage photos, and policy documents and claim forms generated by a script.">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
          <marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker>
          <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkd"/></marker>
          <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mkc"/></marker>
          <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mks"/></marker>
        </defs>

        <!-- Layer 1: claimant -->
        <text class="band" x="60" y="36">CLAIMANT</text>
        <rect class="box" x="300" y="50" width="560" height="50" rx="4"/>
        <text class="t" x="580" y="71" text-anchor="middle">Web chat page</text>
        <text class="s" x="580" y="89" text-anchor="middle">signs in · asks · uploads a claim form or a car damage photo</text>
        <rect class="box" x="900" y="50" width="240" height="50" rx="4"/>
        <text class="t" x="1020" y="71" text-anchor="middle">Entra External ID</text>
        <text class="s" x="1020" y="89" text-anchor="middle">claimant sign-in · token</text>
        <path class="aux dash" d="M860,75 H897" marker-end="url(#ah)"/>

        <path class="sec" d="M340,100 V147" marker-end="url(#ahs)"/>
        <circle class="badge-s" cx="322" cy="124" r="9"/><text class="bn" x="322" y="128" text-anchor="middle">a</text>
        <text class="fs" x="306" y="128" text-anchor="end">upload</text>

        <path class="flow" d="M440,100 V147" marker-end="url(#aha)"/>
        <circle class="badge" cx="458" cy="124" r="9"/><text class="bn" x="458" y="128" text-anchor="middle">1</text>
        <text class="fl" x="472" y="128">question + token</text>
        <path class="flow" d="M720,150 V103" marker-end="url(#aha)"/>
        <circle class="badge" cx="738" cy="124" r="9"/><text class="bn" x="738" y="128" text-anchor="middle">6</text>
        <text class="fl" x="752" y="128">answer with sources</text>

        <!-- Layer 2: app -->
        <text class="band" x="60" y="170">YOUR APP</text>
        <text class="band" x="60" y="186">CONTAINER APPS</text>
        <rect class="hub" x="300" y="150" width="560" height="110" rx="6"/>
        <text class="t" x="316" y="173">Claims assistant API · ASP.NET Core (.NET)</text>
        <rect class="chip" x="316" y="184" width="168" height="26" rx="3"/><text class="c" x="400" y="201" text-anchor="middle">signed-in session</text>
        <rect class="chip" x="496" y="184" width="168" height="26" rx="3"/><text class="c" x="580" y="201" text-anchor="middle">claim id from session only</text>
        <rect class="chip" x="676" y="184" width="168" height="26" rx="3"/><text class="c" x="760" y="201" text-anchor="middle">runs the function tools</text>
        <rect class="chip" x="316" y="220" width="168" height="26" rx="3"/><text class="c" x="400" y="237" text-anchor="middle">approval queue</text>
        <rect class="chip" x="496" y="220" width="168" height="26" rx="3"/><text class="c" x="580" y="237" text-anchor="middle">handler summary · JSON</text>
        <rect class="chip" x="676" y="220" width="168" height="26" rx="3"/><text class="c" x="760" y="237" text-anchor="middle">OpenTelemetry traces</text>

        <rect class="box" x="900" y="150" width="240" height="50" rx="4"/>
        <text class="t" x="1020" y="171" text-anchor="middle">Claims handler page</text>
        <text class="s" x="1020" y="189" text-anchor="middle">approves callbacks · reads summaries</text>
        <path class="aux dash" d="M863,175 H897" marker-start="url(#ah)" marker-end="url(#ah)"/>

        <!-- App to Claims API -->
        <path class="flow-c" d="M860,245 H1160 V628 H1143" marker-end="url(#ahc)"/>
        <text class="fc" x="1150" y="238" text-anchor="end">GET /claims/{id from the session}</text>
        <circle class="badge-c" cx="1160" cy="565" r="9"/><text class="bn" x="1160" y="569" text-anchor="middle">4</text>

        <!-- Foundry project -->
        <rect class="group" x="30" y="292" width="1110" height="263" rx="6"/>
        <text class="band" x="1124" y="312" text-anchor="end">MICROSOFT FOUNDRY · ONE PROJECT</text>

        <path class="flow" d="M440,260 V322" marker-end="url(#aha)"/>
        <circle class="badge" cx="458" cy="285" r="9"/><text class="bn" x="458" y="289" text-anchor="middle">2</text>
        <text class="fl" x="472" y="289">run agent on the thread</text>
        <path class="flow-c" d="M720,322 V263" marker-start="url(#ahc)" marker-end="url(#ahc)"/>
        <circle class="badge-c" cx="738" cy="285" r="9"/><text class="bn" x="738" y="289" text-anchor="middle">4</text>
        <text class="fc" x="752" y="289">function call ⇄ result</text>

        <path class="sec" d="M300,240 H150 V322" marker-end="url(#ahs)"/>
        <circle class="badge-s" cx="150" cy="283" r="9"/><text class="bn" x="150" y="287" text-anchor="middle">b</text>
        <text class="fs" x="166" y="287">analyze form</text>

        <rect class="box" x="60" y="325" width="180" height="115" rx="4"/>
        <text class="t" x="150" y="349" text-anchor="middle">Content Understanding</text>
        <text class="s" x="150" y="369" text-anchor="middle">claim-form analyzer</text>
        <text class="s" x="150" y="386" text-anchor="middle">OCR + layout + fields</text>
        <text class="s" x="150" y="403" text-anchor="middle">→ markdown + JSON</text>
        <text class="s" x="150" y="420" text-anchor="middle">for the agent</text>

        <rect class="hub" x="300" y="325" width="560" height="115" rx="6"/>
        <text class="t" x="316" y="348">Agent · Foundry Agent Service</text>
        <rect class="chip" x="316" y="360" width="168" height="26" rx="3"/><text class="c" x="400" y="377" text-anchor="middle">role + instructions</text>
        <rect class="chip" x="496" y="360" width="168" height="26" rx="3"/><text class="c" x="580" y="377" text-anchor="middle">conversation thread</text>
        <rect class="chip" x="676" y="360" width="168" height="26" rx="3"/><text class="c" x="760" y="377" text-anchor="middle">image input · damage photo</text>
        <rect class="chip" x="316" y="398" width="168" height="26" rx="3"/><text class="c" x="400" y="415" text-anchor="middle">tool: knowledge search</text>
        <rect class="chip" x="496" y="398" width="168" height="26" rx="3"/><text class="c" x="580" y="415" text-anchor="middle">tool: get_claim_status</text>
        <rect class="chip" x="676" y="398" width="168" height="26" rx="3"/><text class="c" x="760" y="415" text-anchor="middle">tool: request_callback ✓</text>

        <rect class="box" x="900" y="325" width="220" height="50" rx="4"/>
        <text class="t" x="1010" y="346" text-anchor="middle">Guardrails</text>
        <text class="s" x="1010" y="364" text-anchor="middle">content filters · Prompt Shields</text>
        <path class="aux" d="M860,350 H897" marker-end="url(#ah)"/>
        <rect class="box" x="900" y="390" width="220" height="50" rx="4"/>
        <text class="t" x="1010" y="411" text-anchor="middle">Evaluations</text>
        <text class="s" x="1010" y="429" text-anchor="middle">groundedness · relevance · leaks</text>

        <path class="flow" d="M430,443 V477" marker-start="url(#aha)" marker-end="url(#aha)"/>
        <circle class="badge" cx="448" cy="460" r="9"/><text class="bn" x="448" y="464" text-anchor="middle">5</text>
        <text class="fl" x="462" y="464">write the answer</text>
        <rect class="box" x="300" y="480" width="260" height="58" rx="4"/>
        <text class="t" x="430" y="502" text-anchor="middle">Model deployments</text>
        <text class="s" x="430" y="521" text-anchor="middle">gpt-5-mini · text-embedding-3-small</text>

        <!-- Data -->
        <text class="band" x="60" y="588">DATA</text>
        <path class="flow-d" d="M730,440 V597" marker-end="url(#ahd)"/>
        <circle class="badge-d" cx="748" cy="505" r="9"/><text class="bn" x="748" y="509" text-anchor="middle">3</text>
        <text class="fd" x="762" y="509">search knowledge</text>

        <rect class="box" x="60" y="600" width="180" height="56" rx="4"/>
        <text class="t" x="150" y="623" text-anchor="middle">Blob Storage</text>
        <text class="s" x="150" y="641" text-anchor="middle">policy docs · photos · uploads</text>
        <path class="aux dash" d="M150,597 V443" marker-end="url(#ah)"/>
        <text class="al" x="160" y="578">reads the upload</text>

        <path class="aux" d="M240,628 H597" marker-end="url(#ah)"/>
        <text class="al" x="420" y="620" text-anchor="middle">indexer: chunk + embed</text>

        <rect class="box" x="600" y="600" width="260" height="56" rx="4"/>
        <text class="t" x="730" y="623" text-anchor="middle">Azure AI Search · Basic</text>
        <text class="s" x="730" y="641" text-anchor="middle">hybrid: keyword + vector · knowledge index</text>

        <rect class="ext" x="900" y="600" width="240" height="56" rx="4"/>
        <text class="t" x="1020" y="623" text-anchor="middle">Claims API (mock)</text>
        <text class="s" x="1020" y="641" text-anchor="middle">ASP.NET Core · SQLite · read-only</text>

        <!-- Source data: loaded once by scripts -->
        <text class="band" x="60" y="700">SOURCE DATA · LOADED ONCE</text>
        <rect class="ext" x="60" y="712" width="180" height="56" rx="4"/>
        <text class="t" x="150" y="735" text-anchor="middle">Car damage photos</text>
        <text class="s" x="150" y="753" text-anchor="middle">public dataset · CC0</text>
        <path class="aux" d="M150,712 V659" marker-end="url(#ah)"/>

        <rect class="ext" x="300" y="712" width="260" height="56" rx="4"/>
        <text class="t" x="430" y="735" text-anchor="middle">Generated by a script</text>
        <text class="s" x="430" y="753" text-anchor="middle">~15 policy docs · claim-form PDFs</text>
        <path class="aux" d="M430,712 V686 H200 V659" marker-end="url(#ah)"/>

        <path class="aux dash" d="M900,740 H563" marker-end="url(#ah)"/>
        <text class="al" x="730" y="733" text-anchor="middle">claim rows → form PDFs</text>

        <rect class="ext" x="900" y="712" width="240" height="56" rx="4"/>
        <text class="t" x="1020" y="735" text-anchor="middle">insurance_claims.csv</text>
        <text class="s" x="1020" y="753" text-anchor="middle">Mendeley Data · CC BY 4.0</text>
        <path class="aux" d="M1020,712 V659" marker-end="url(#ah)"/>
        <text class="al" x="1030" y="690">+ status columns</text>

        <!-- Ops -->
        <text class="band" x="60" y="812">OPERATE</text>
        <rect class="box" x="60" y="824" width="180" height="56" rx="4"/>
        <text class="t" x="150" y="847" text-anchor="middle">GitHub Actions</text>
        <text class="s" x="150" y="865" text-anchor="middle">Bicep deploy · eval gate</text>
        <rect class="box" x="300" y="824" width="260" height="56" rx="4"/>
        <text class="t" x="430" y="847" text-anchor="middle">Application Insights</text>
        <text class="s" x="430" y="865" text-anchor="middle">traces · tokens · latency · safety events</text>
        <rect class="box" x="600" y="824" width="260" height="56" rx="4"/>
        <text class="t" x="730" y="847" text-anchor="middle">Managed identity + RBAC</text>
        <text class="s" x="730" y="865" text-anchor="middle">no keys anywhere</text>
        <rect class="box" x="900" y="824" width="240" height="56" rx="4"/>
        <text class="t" x="1020" y="847" text-anchor="middle">Cost Management</text>
        <text class="s" x="1020" y="865" text-anchor="middle">$10 budget alert</text>
      </svg>
