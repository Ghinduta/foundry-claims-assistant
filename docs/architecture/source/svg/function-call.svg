<svg viewBox="0 0 1200 500" role="img" aria-label="Sequence of a claim question: the browser sends the question, the app starts a run, the agent asks for get_claim_status with no claim id, the app calls the Claims API with the claim id from the session, submits the result, and the agent writes the answer.">
        <defs>
          <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mka"/></marker>
          <marker id="fs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mks"/></marker>
        </defs>

        <rect class="box" x="50" y="20" width="200" height="50" rx="4"/>
        <text class="t" x="150" y="41" text-anchor="middle">Web chat page</text>
        <text class="s" x="150" y="59" text-anchor="middle">claimant, signed in</text>
        <rect class="hub" x="350" y="20" width="200" height="50" rx="4"/>
        <text class="t" x="450" y="41" text-anchor="middle">Your app</text>
        <text class="s" x="450" y="59" text-anchor="middle">ASP.NET Core</text>
        <rect class="box" x="650" y="20" width="200" height="50" rx="4"/>
        <text class="t" x="750" y="41" text-anchor="middle">Foundry agent</text>
        <text class="s" x="750" y="59" text-anchor="middle">model + thread</text>
        <rect class="ext" x="950" y="20" width="200" height="50" rx="4"/>
        <text class="t" x="1050" y="41" text-anchor="middle">Claims API (mock)</text>
        <text class="s" x="1050" y="59" text-anchor="middle">read-only</text>

        <line class="life" x1="150" y1="70" x2="150" y2="480"/>
        <line class="life" x1="450" y1="70" x2="450" y2="480"/>
        <line class="life" x1="750" y1="70" x2="750" y2="480"/>
        <line class="life" x1="1050" y1="70" x2="1050" y2="480"/>

        <text class="fl" x="300" y="104" text-anchor="middle">1 "What's the status of my claim?"</text>
        <path class="flow" d="M150,112 H447" marker-end="url(#fa)"/>

        <text class="fl" x="600" y="152" text-anchor="middle">2 add message · start run</text>
        <path class="flow" d="M450,160 H747" marker-end="url(#fa)"/>

        <text class="fs" x="600" y="200" text-anchor="middle">3 requires action: get_claim_status()</text>
        <path class="sec ret" d="M750,208 H453" marker-end="url(#fs)"/>
        <text class="al" x="600" y="226" text-anchor="middle">the model sends no claim id</text>

        <text class="fs" x="750" y="262" text-anchor="middle">4 GET /claims/CLM-1042 · the id comes from the session</text>
        <path class="sec" d="M450,270 H1047" marker-end="url(#fs)"/>

        <text class="fl" x="750" y="310" text-anchor="middle">5 status · phase · missing documents</text>
        <path class="flow ret" d="M1050,318 H453" marker-end="url(#fa)"/>

        <text class="fl" x="600" y="358" text-anchor="middle">6 submit tool output</text>
        <path class="flow" d="M450,366 H747" marker-end="url(#fa)"/>

        <text class="fl" x="600" y="406" text-anchor="middle">7 answer, screened by guardrails</text>
        <path class="flow ret" d="M750,414 H453" marker-end="url(#fa)"/>

        <text class="fl" x="300" y="454" text-anchor="middle">8 answer</text>
        <path class="flow ret" d="M450,462 H153" marker-end="url(#fa)"/>
      </svg>
